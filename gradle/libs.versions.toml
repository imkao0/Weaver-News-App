# Weaver News — Version Catalog
# Single source of truth for all dependency coordinates.
#
# NOTE — deliberate version choices:
#   * AGP stays on 8.7.3 so the build remains compatible with
#     the current Android Studio/Gradle 8.11.1 toolchain. A side effect is that
#     the Firebase Performance Gradle plugin must stay on the 1.4.x line.
#   * KSP is pinned to 2.2.10-2.0.2 — the release that matches Kotlin 2.2.10.
#   * Hilt is pinned to 2.57.2 — the newest Hilt release line
#     whose KSP processor runs on KSP 2.0.x (KSP1) AND whose unshaded
#     kotlinx-metadata supports Kotlin 2.2 (Dagger #4779, fixed in 2.57). Hilt
#     2.51.x (the original pin) crashes on Kotlin 2.2's metadata.
#   * androidx.hilt is pinned to 1.2.0 — 1.3.0 is compiled
#     against Hilt 2.59's KSType processor.
#   * Room is pinned to 2.7.2 — Room 2.8.x requires KSP2.
#   * Coil stays on 2.7.0 — coil3 is a group-id migration
#     scheduled with the UI rework milestone.
#   * accompanist-permissions stays on 0.36.0 — 0.37.x
#     requires Kotlin 2.2.20+.

[versions]
# --- Build platform ---
androidGradlePlugin = "8.13.2"          # pinned to 8.9.1 — the minimum the Navigation3/lifecycle 2.10 stack requires; stays on the Gradle 8.x line
kotlin = "2.4.20"
ksp = "2.2.10-2.0.2"                   # must match the Kotlin 2.2.10 compiler
ktlint = "12.3.0"
detekt = "1.23.8"
gmsPlugin = "4.5.0"
firebaseCrashlyticsGradle = "3.0.8"
firebasePerfGradlePlugin = "1.4.2"
baselineProfile = "1.5.0"              # latest stable compatible with AGP 8.7.3

# --- AndroidX core / lifecycle ---
ktx = "1.19.1"
appcompat = "1.8.0"
androidMaterial = "1.13.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
coreSplashscreen = "1.2.0"
androidxWindowCore = "1.5.1"           # window-core layout WindowSizeClass

# --- Compose ---
composeBom = "2025.12.01"              # latest stable BOM compatible with Kotlin 2.2.10
androidMaterial3Adaptive = "1.3.0"     # adaptive skips 1.1.1: 1.1.0 -> 1.2.0
navigation3 = "1.1.7"
lifecycleViewmodelNavigation3 = "2.11.0"
materialIconsExtended = "1.7.8"
coilCompose = "2.7.0"
composeShimmer = "1.3.3"
accompanistPermissions = "0.36.0"      # 0.37.x needs Kotlin 2.2.20+
gson = "2.14.0"
jsoup = "1.23.2"
accompanistSystemuicontroller = "0.36.0"

# --- Dependency injection & background work ---
daggerHilt = "2.60.1"                  # 2.57.2 is the newest line that fixes the Kotlin 2.2 metadata bug (#4779) while still running on KSP1 / AGP 8.x
androidxHilt = "1.4.0"
hiltAndroidTesting = "2.57.2"
workRuntimeKtx = "2.11.2"              # latest stable at plan time

# --- Networking & serialization ---
retrofit = "3.0.0"
okhttp = "5.3.2"
moshi = "1.15.2"
kotlinxSerializationJson = "1.8.0"     # powers Navigation-3 type-safe routes
androidxBrowser = "1.10.0"                # Chrome Custom Tabs for the detail screen
media3 = "1.8.0"                         # ExoPlayer/Media3 for the TikTok-style full-screen video player
androidYoutubePlayer = "13.0.0"

# --- Persistence ---
room = "2.7.2"
datastorePreferences = "1.2.1"         # latest stable at plan time

# --- Coroutines ---
kotlinxCoroutines = "1.10.2"

# --- Developer experience & debugging ---
timber = "5.0.1"
chuckerVersion = "4.3.1"
leakcanaryAndroid = "2.14"

# --- Performance & telemetry ---
firebaseBom = "33.13.0"                # BoM-managed analytics-ktx/crashlytics/perf (latest stable)
androidxBenchmarkJunit4 = "1.5.0"      # aligned with baseline-profile plugin
profileinstaller = "1.4.1"

# --- Testing ---
junit = "4.13.2"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestUiAutomator = "2.3.0"
espresso = "3.7.0"
androidxArchCoreTesting = "2.2.0"
turbine = "1.2.1"
mockitoCore = "5.22.0"
mockitoKotlin = "5.4.0"

# --- Misc ---
desugarJdkLibs = "2.0.4"

